version: '3.8'

services:
  flask-app:
    build: .
    container_name: bizowl-flask
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./Data:/app/Data
    depends_on:
      - mail-relay
    # Uncomment if you want to run with gunicorn for production
    # command: gunicorn -w 4 -b 0.0.0.0:5000 app:app

  mail-relay:
    image: bytemark/smtp
    container_name: mail-relay
    restart: always
    ports:
      - "2525:25"
    # This is optional and only needed if you want to avoid Gmail SMTP restrictions.
    # Otherwise, your Flask app will use Gmail's SMTP directly.

# Optional: Add a volume for persistent data if needed
volumes:
  data:

